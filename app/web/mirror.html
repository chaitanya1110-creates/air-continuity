<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Screen Mirror - AirContinuity</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0d0d0f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .mirror-container {
            position: relative;
            max-width: 95vw;
            max-height: 92vh;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
            background: #000;
        }
        video {
            display: block;
            max-height: 90vh;
            width: auto;
            border-radius: 26px;
            object-fit: contain;
        }
        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            text-align: center;
        }
        .pulse-loader {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #0a84ff;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(10, 132, 255, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(10, 132, 255, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(10, 132, 255, 0); }
        }
        .control-bar {
            position: absolute;
            bottom: 16px;
            display: flex;
            gap: 12px;
            background: rgba(30, 30, 35, 0.75);
            backdrop-filter: blur(20px);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-ctrl {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn-ctrl:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="mirror-container" id="mirrorContainer">
        <video id="remoteVideo" autoplay playsinline muted></video>
        <div class="placeholder" id="placeholder">
            <div class="pulse-loader"></div>
            <h2>Waiting for iPhone Screen Broadcast...</h2>
            <p style="color: #8e8e93; font-size: 14px; margin-top: 8px;">
                On your iPhone, tap <strong>Start Screen Mirror</strong> in the AirContinuity companion web page.
            </p>
        </div>
    </div>

    <div class="control-bar">
        <button class="btn-ctrl" id="btnFullscreen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
            Fullscreen
        </button>
        <button class="btn-ctrl" id="btnRotate">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
            Rotate
        </button>
    </div>

    <script>
        const video = document.getElementById("remoteVideo");
        const placeholder = document.getElementById("placeholder");
        let peerConnection = null;
        let socket = null;
        let rotation = 0;
        let iceCandidateQueue = [];

        function connectWebSocket() {
            const protocol = location.protocol === "https:" ? "wss:" : "ws:";
            socket = new WebSocket(`${protocol}//${location.host}/ws`);

            socket.onopen = () => console.log("Mirror Viewer WS Connected");
            socket.onclose = () => setTimeout(connectWebSocket, 2000);

            socket.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "webrtc_offer") {
                    handleOffer(data.sdp);
                } else if (data.type === "webrtc_candidate") {
                    if (peerConnection && peerConnection.remoteDescription) {
                        try {
                            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                        } catch (e) {
                            console.warn("Error adding ICE candidate:", e);
                        }
                    } else {
                        iceCandidateQueue.push(data.candidate);
                    }
                } else if (data.type === "screen_mirror_stop") {
                    video.style.display = "none";
                    placeholder.style.display = "flex";
                }
            };
        }

        async function handleOffer(sdp) {
            iceCandidateQueue = [];
            peerConnection = new RTCPeerConnection({
                iceServers: [
                    { urls: "stun:stun.l.google.com:19302" },
                    { urls: "stun:stun1.l.google.com:19302" }
                ]
            });

            peerConnection.ontrack = (event) => {
                video.srcObject = event.streams[0];
                video.style.display = "block";
                placeholder.style.display = "none";
                video.play().catch(e => console.warn("Video play notice:", e));
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: "webrtc_candidate",
                        candidate: event.candidate
                    }));
                }
            };

            peerConnection.onconnectionstatechange = () => {
                console.log("WebRTC state:", peerConnection.connectionState);
                if (peerConnection.connectionState === "disconnected" || peerConnection.connectionState === "failed") {
                    video.style.display = "none";
                    placeholder.style.display = "flex";
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(sdp));

            // Drain buffered ICE candidates
            while (iceCandidateQueue.length > 0) {
                const cand = iceCandidateQueue.shift();
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
                } catch (e) {
                    console.warn("Drain ICE candidate error:", e);
                }
            }

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            socket.send(JSON.stringify({
                type: "webrtc_answer",
                sdp: answer
            }));
        }

        // Fullscreen & Rotation
        document.getElementById("btnFullscreen").addEventListener("click", () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        document.getElementById("btnRotate").addEventListener("click", () => {
            rotation = (rotation + 90) % 360;
            video.style.transform = `rotate(${rotation}deg)`;
        });

        // Mouse click relay to phone
        video.addEventListener("mousedown", (e) => {
            const rect = video.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "remote_input",
                    action: "click",
                    x: x,
                    y: y
                }));
            }
        });

        connectWebSocket();
    </script>
</body>
</html>
